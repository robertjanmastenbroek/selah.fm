    <rect x="100" y="350" width="4" height="44" rx="2"/>
    <rect x="110" y="340" width="4" height="54" rx="2"/>
    <rect x="120" y="330" width="4" height="64" rx="2"/>
    <rect x="130" y="340" width="4" height="54" rx="2"/>
    <rect x="140" y="350" width="4" height="44" rx="2"/>
