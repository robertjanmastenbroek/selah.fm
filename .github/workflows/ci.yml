name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          NEXTAUTH_SECRET: ci-test-secret-do-not-use-in-production
          NEXTAUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: dummy
          GOOGLE_CLIENT_SECRET: dummy
          STRIPE_SECRET_KEY: sk_test_dummy
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_dummy
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
          SUPABASE_DATABASE_URL: postgresql://dummy:dummy@localhost:5432/postgres
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          CRON_SECRET: ci-test-cron-secret
          RESEND_API_KEY: re_placeholder
          RESEND_AUDIENCE_ID: dummy
          DEEPSEEK_API_KEY: sk-dummy-key-for-ci
